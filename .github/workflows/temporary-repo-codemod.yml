name: Temporary scoped repo codemod

on:
  push:
    branches:
      - codemod/bookmark-db-and-date-hardening

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, 'Apply bookmark DB/date codemod') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codemod branch
        uses: actions/checkout@v4
        with:
          ref: codemod/bookmark-db-and-date-hardening
          fetch-depth: 0

      - name: Apply code changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, needle, replacement, label) {
            let src = fs.readFileSync(file, 'utf8');
            if (!src.includes(needle)) throw new Error(`Missing ${label} in ${file}`);
            src = src.replace(needle, replacement);
            fs.writeFileSync(file, src);
          }

          replaceOnce(
            'src/bookmarks-db.ts',
            "WHEN b.bookmarked_at GLOB '____-__-__*' THEN b.bookmarked_at\n        WHEN b.posted_at GLOB '____-__-__*' THEN b.posted_at",
            "WHEN b.bookmarked_at GLOB '????-??-??*' THEN b.bookmarked_at\n        WHEN b.posted_at GLOB '????-??-??*' THEN b.posted_at",
            'SQLite date GLOB pattern'
          );

          replaceOnce(
            'src/bookmarks-db.ts',
            "db.run(`INSERT OR REPLACE INTO bookmarks VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, [r.id, r.tweetId, r.url, r.text, r.authorHandle ?? null, r.authorName ?? null, r.authorProfileImageUrl ?? null, r.postedAt ?? null, r.bookmarkedAt ?? null, r.syncedAt, r.conversationId ?? null, r.inReplyToStatusId ?? null, r.quotedStatusId ?? null, r.language ?? null, r.engagement?.likeCount ?? null, r.engagement?.repostCount ?? null, r.engagement?.replyCount ?? null, r.engagement?.quoteCount ?? null, r.engagement?.bookmarkCount ?? null, r.engagement?.viewCount ?? null, r.media?.length ?? 0, r.links?.length ?? 0, r.links?.length ? JSON.stringify(r.links) : null, r.tags?.length ? JSON.stringify(r.tags) : null, r.ingestedVia ?? null, preserved?.categories ?? null, preserved?.primaryCategory ?? 'unclassified', preserved?.githubUrls ?? (githubUrls.length ? JSON.stringify(githubUrls) : null), preserved?.domains ?? null, preserved?.primaryDomain ?? null, r.quotedTweet ? JSON.stringify(r.quotedTweet) : (preserved?.quotedTweetJson ?? null)]);",
            `db.run(\`INSERT OR REPLACE INTO bookmarks (
    id,
    tweet_id,
    url,
    text,
    author_handle,
    author_name,
    author_profile_image_url,
    posted_at,
    bookmarked_at,
    synced_at,
    conversation_id,
    in_reply_to_status_id,
    quoted_status_id,
    language,
    like_count,
    repost_count,
    reply_count,
    quote_count,
    bookmark_count,
    view_count,
    media_count,
    link_count,
    links_json,
    tags_json,
    ingested_via,
    categories,
    primary_category,
    github_urls,
    domains,
    primary_domain,
    quoted_tweet_json
  ) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\`, [
    r.id,
    r.tweetId,
    r.url,
    r.text,
    r.authorHandle ?? null,
    r.authorName ?? null,
    r.authorProfileImageUrl ?? null,
    r.postedAt ?? null,
    r.bookmarkedAt ?? null,
    r.syncedAt,
    r.conversationId ?? null,
    r.inReplyToStatusId ?? null,
    r.quotedStatusId ?? null,
    r.language ?? null,
    r.engagement?.likeCount ?? null,
    r.engagement?.repostCount ?? null,
    r.engagement?.replyCount ?? null,
    r.engagement?.quoteCount ?? null,
    r.engagement?.bookmarkCount ?? null,
    r.engagement?.viewCount ?? null,
    r.media?.length ?? 0,
    r.links?.length ?? 0,
    r.links?.length ? JSON.stringify(r.links) : null,
    r.tags?.length ? JSON.stringify(r.tags) : null,
    r.ingestedVia ?? null,
    preserved?.categories ?? null,
    preserved?.primaryCategory ?? 'unclassified',
    preserved?.githubUrls ?? (githubUrls.length ? JSON.stringify(githubUrls) : null),
    preserved?.domains ?? null,
    preserved?.primaryDomain ?? null,
    r.quotedTweet ? JSON.stringify(r.quotedTweet) : (preserved?.quotedTweetJson ?? null)
  ]);`,
            'positional bookmark insert'
          );

          fs.rmSync('.codemod-trigger', {force: true});
          fs.rmSync('.github/workflows/temporary-repo-codemod.yml', {force: true});
          NODE

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply bookmark DB/date codemod"
          git push origin HEAD:codemod/bookmark-db-and-date-hardening
