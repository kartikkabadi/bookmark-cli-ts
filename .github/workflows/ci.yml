name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify source, tests, and CLI smoke
        shell: bash
        run: |
          set -o pipefail
          pnpm run check 2>&1 | tee check.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-log-node-${{ matrix.node }}
          path: check.log
          if-no-files-found: error
      - name: Pack and clean-room test npm distribution
        if: matrix.node == 24
        shell: bash
        run: |
          set -o pipefail
          pnpm run release:pack 2>&1 | tee release-pack.log
      - name: Upload connector package artifacts
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-x-npm-node-${{ matrix.node }}
          path: |
            release-pack.log
            artifacts/npm/
          if-no-files-found: error
