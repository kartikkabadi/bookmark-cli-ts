name: Temporary P0 hardening runner

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/p0-hardening-source' &&
      !contains(github.event.pull_request.head.sha, 'Apply P0 source hardening')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: work/p0-hardening-source
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text); }
          function replaceRequired(text, oldText, newText, label) {
            if (!text.includes(oldText)) throw new Error(`Missing ${label}`);
            return text.replace(oldText, newText);
          }

          let db = read('src/bookmarks-db.ts');
          db = db.replaceAll("GLOB '____-__-__*'", "GLOB '????-??-??*'");
          const oldInsertStart = "db.run(`INSERT OR REPLACE INTO bookmarks VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, [";
          const newInsertStart = `db.run(\`INSERT OR REPLACE INTO bookmarks (
    id,
    tweet_id,
    url,
    text,
    author_handle,
    author_name,
    author_profile_image_url,
    posted_at,
    bookmarked_at,
    synced_at,
    conversation_id,
    in_reply_to_status_id,
    quoted_status_id,
    language,
    like_count,
    repost_count,
    reply_count,
    quote_count,
    bookmark_count,
    view_count,
    media_count,
    link_count,
    links_json,
    tags_json,
    ingested_via,
    categories,
    primary_category,
    github_urls,
    domains,
    primary_domain,
    quoted_tweet_json
  ) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\`, [`;
          db = replaceRequired(db, oldInsertStart, newInsertStart, 'positional bookmark insert prefix');
          if (db.includes('INSERT OR REPLACE INTO bookmarks VALUES')) throw new Error('positional insert still present');
          write('src/bookmarks-db.ts', db);

          let gql = read('src/graphql-bookmarks.ts');
          const helperAnchor = `function snowflakeToIso(snowflake: string): string | null {
  try {
    const id = BigInt(snowflake);
    const ms = Number(id >> 22n) + Number(TWITTER_SNOWFLAKE_EPOCH);
    const date = new Date(ms);
    return Number.isFinite(date.getTime()) ? date.toISOString() : null;
  } catch {
    return null;
  }
}`;
          const helperAdd = `${helperAnchor}

function timestampLikeToIso(value: unknown): string | null {
  if (typeof value === 'string') {
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (/^\\d+$/.test(trimmed)) {
      const n = Number(trimmed);
      if (Number.isSafeInteger(n)) {
        if (trimmed.length <= 10) return new Date(n * 1000).toISOString();
        if (trimmed.length >= 12 && trimmed.length <= 14) return new Date(n).toISOString();
        if (trimmed.length >= 15 && trimmed.length <= 17) return new Date(Math.floor(n / 1000)).toISOString();
      }
      return snowflakeToIso(trimmed);
    }
    const parsed = Date.parse(trimmed);
    return Number.isFinite(parsed) ? new Date(parsed).toISOString() : null;
  }
  if (typeof value === 'number' && Number.isFinite(value)) {
    if (value < 10_000_000_000) return new Date(value * 1000).toISOString();
    if (value < 10_000_000_000_000) return new Date(value).toISOString();
    if (value < 10_000_000_000_000_000) return new Date(Math.floor(value / 1000)).toISOString();
  }
  return null;
}

function collectBookmarkTimestampCandidates(value: unknown, out: unknown[] = [], depth = 0): unknown[] {
  if (depth > 8 || value == null) return out;
  if (Array.isArray(value)) {
    for (const item of value) collectBookmarkTimestampCandidates(item, out, depth + 1);
    return out;
  }
  if (typeof value !== 'object') return out;
  for (const [key, child] of Object.entries(value as Record<string, unknown>)) {
    if (/^(sortIndex|sort_index|bookmarked_at|bookmarkedAt|bookmark_created_at|bookmarkCreatedAt|saved_at|savedAt)$/i.test(key)) out.push(child);
    if (typeof child === 'object' && child != null) collectBookmarkTimestampCandidates(child, out, depth + 1);
  }
  return out;
}

function extractBookmarkedAtFromEntry(entry: unknown, record: BookmarkRecord): string | null {
  const candidates = collectBookmarkTimestampCandidates(entry);
  for (const candidate of candidates) {
    const iso = timestampLikeToIso(candidate);
    if (!iso) continue;
    const sanitized = sanitizeBookmarkedAt({...record, bookmarkedAt: iso});
    if (sanitized.bookmarkedAt) return sanitized.bookmarkedAt;
  }
  return null;
}`;
          gql = replaceRequired(gql, helperAnchor, helperAdd, 'snowflake helper anchor');
          const oldAssignment = `    if (record) {
      // Extract bookmarkedAt from the entry's sortIndex (snowflake timestamp)
      if (entry.sortIndex) {
        record.bookmarkedAt = snowflakeToIso(entry.sortIndex) ?? record.bookmarkedAt;
      }
      records.push(sanitizeBookmarkedAt(record));
    }`;
          const newAssignment = `    if (record) {
      record.bookmarkedAt = extractBookmarkedAtFromEntry(entry, record) ?? record.bookmarkedAt;
      records.push(sanitizeBookmarkedAt(record));
    }`;
          gql = replaceRequired(gql, oldAssignment, newAssignment, 'bookmarkedAt assignment');
          write('src/graphql-bookmarks.ts', gql);

          let dbTests = read('tests/bookmarks-db.test.ts');
          dbTests = dbTests.replace("sanitizeFtsQuery } from '../src/bookmarks-db.js';", "sanitizeFtsQuery, listBookmarks } from '../src/bookmarks-db.js';");
          if (!dbTests.includes('buildIndex tolerates additive bookmark table columns')) {
            dbTests += `

test('buildIndex tolerates additive bookmark table columns', async () => {
  await withIsolatedDataDir(async (dir) => {
    const jsonl = FIXTURES.map((r) => JSON.stringify(r)).join('\\n') + '\\n';
    await writeFile(path.join(dir, 'bookmarks.jsonl'), jsonl);
    await buildIndex();
    const dbPath = twitterBookmarksIndexPath();
    const db = await openDb(dbPath);
    try {
      db.run('ALTER TABLE bookmarks ADD COLUMN future_column TEXT');
      saveDb(db, dbPath);
    } finally {
      db.close();
    }
    const result = await buildIndex();
    assert.equal(result.recordCount, 3);
    const bookmark = await getBookmarkById('1');
    assert.ok(bookmark);
    assert.equal(bookmark.text, 'Machine learning is transforming healthcare');
  });
});

test('listBookmarks sorts valid ISO-like bookmark dates using SQLite GLOB semantics', async () => {
  await withIsolatedDataDir(async (dir) => {
    const records = [
      {...FIXTURES[0], id: 'old', tweetId: '100', bookmarkedAt: '2026-01-01T00:00:00.000Z'},
      {...FIXTURES[1], id: 'new', tweetId: '101', bookmarkedAt: '2026-02-01T00:00:00.000Z'},
    ];
    await writeFile(path.join(dir, 'bookmarks.jsonl'), records.map((r) => JSON.stringify(r)).join('\\n') + '\\n');
    await buildIndex({force: true});
    const listed = await listBookmarks({sort: 'desc', limit: 2});
    assert.equal(listed[0].id, 'new');
    assert.equal(listed[1].id, 'old');
  });
});
`;
          }
          write('tests/bookmarks-db.test.ts', dbTests);

          let gqlTests = read('tests/graphql-bookmarks.test.ts');
          if (!gqlTests.includes('parseBookmarksResponse: extracts bookmarkedAt from nested bookmark metadata')) {
            const needle = "test('parseBookmarksResponse: handles missing sortIndex gracefully', () => {";
            const insert = `test('parseBookmarksResponse: extracts bookmarkedAt from nested bookmark metadata', () => {
  const tr = makeTweetResult();
  const resp = {data: {bookmark_timeline_v2: {timeline: {instructions: [{type: 'TimelineAddEntries', entries: [{entryId: 'tweet-0', content: {itemContent: { tweet_results: { result: tr } }, bookmark_info: { bookmarked_at: '2026-03-12T00:00:00.000Z' }}}]}]}}}};
  const { records } = parseBookmarksResponse(resp, NOW);
  assert.equal(records.length, 1);
  assert.equal(records[0].bookmarkedAt, '2026-03-12T00:00:00.000Z');
});

`;
            gqlTests = replaceRequired(gqlTests, needle, insert + needle, 'GraphQL test insertion point');
          }
          write('tests/graphql-bookmarks.test.ts', gqlTests);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bookmarks-db.ts src/graphql-bookmarks.ts tests/bookmarks-db.test.ts tests/graphql-bookmarks.test.ts
          if git diff --cached --quiet; then
            echo "No patch generated"
            exit 0
          fi
          git commit -m "Apply P0 source hardening"
          git push origin HEAD:work/p0-hardening-source
