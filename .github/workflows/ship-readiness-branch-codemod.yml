name: Ship-readiness branch codemod

on:
  push:
    branches:
      - work/ship-readiness-p0

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, 'Apply ship-readiness P0 patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/ship-readiness-p0
          fetch-depth: 0

      - name: Apply patch or record error
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import traceback

          def read(p):
              return Path(p).read_text()

          def write(p, s):
              Path(p).write_text(s)

          def replace_required(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'missing {label}')
              return text.replace(old, new, 1)

          try:
              # bookmarks-db: fix SQLite GLOB and explicit insert column list.
              p = Path('src/bookmarks-db.ts')
              s = p.read_text()
              s = s.replace("GLOB '____-__-__*'", "GLOB '????-??-??*'")
              old_insert = "db.run(`INSERT OR REPLACE INTO bookmarks VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, [r.id, r.tweetId, r.url, r.text, r.authorHandle ?? null, r.authorName ?? null, r.authorProfileImageUrl ?? null, r.postedAt ?? null, r.bookmarkedAt ?? null, r.syncedAt, r.conversationId ?? null, r.inReplyToStatusId ?? null, r.quotedStatusId ?? null, r.language ?? null, r.engagement?.likeCount ?? null, r.engagement?.repostCount ?? null, r.engagement?.replyCount ?? null, r.engagement?.quoteCount ?? null, r.engagement?.bookmarkCount ?? null, r.engagement?.viewCount ?? null, r.media?.length ?? 0, r.links?.length ?? 0, r.links?.length ? JSON.stringify(r.links) : null, r.tags?.length ? JSON.stringify(r.tags) : null, r.ingestedVia ?? null, preserved?.categories ?? null, preserved?.primaryCategory ?? 'unclassified', preserved?.githubUrls ?? (githubUrls.length ? JSON.stringify(githubUrls) : null), preserved?.domains ?? null, preserved?.primaryDomain ?? null, r.quotedTweet ? JSON.stringify(r.quotedTweet) : (preserved?.quotedTweetJson ?? null)]);"
              new_insert = """db.run(`INSERT OR REPLACE INTO bookmarks (
    id,
    tweet_id,
    url,
    text,
    author_handle,
    author_name,
    author_profile_image_url,
    posted_at,
    bookmarked_at,
    synced_at,
    conversation_id,
    in_reply_to_status_id,
    quoted_status_id,
    language,
    like_count,
    repost_count,
    reply_count,
    quote_count,
    bookmark_count,
    view_count,
    media_count,
    link_count,
    links_json,
    tags_json,
    ingested_via,
    categories,
    primary_category,
    github_urls,
    domains,
    primary_domain,
    quoted_tweet_json
  ) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, [
    r.id,
    r.tweetId,
    r.url,
    r.text,
    r.authorHandle ?? null,
    r.authorName ?? null,
    r.authorProfileImageUrl ?? null,
    r.postedAt ?? null,
    r.bookmarkedAt ?? null,
    r.syncedAt,
    r.conversationId ?? null,
    r.inReplyToStatusId ?? null,
    r.quotedStatusId ?? null,
    r.language ?? null,
    r.engagement?.likeCount ?? null,
    r.engagement?.repostCount ?? null,
    r.engagement?.replyCount ?? null,
    r.engagement?.quoteCount ?? null,
    r.engagement?.bookmarkCount ?? null,
    r.engagement?.viewCount ?? null,
    r.media?.length ?? 0,
    r.links?.length ?? 0,
    r.links?.length ? JSON.stringify(r.links) : null,
    r.tags?.length ? JSON.stringify(r.tags) : null,
    r.ingestedVia ?? null,
    preserved?.categories ?? null,
    preserved?.primaryCategory ?? 'unclassified',
    preserved?.githubUrls ?? (githubUrls.length ? JSON.stringify(githubUrls) : null),
    preserved?.domains ?? null,
    preserved?.primaryDomain ?? null,
    r.quotedTweet ? JSON.stringify(r.quotedTweet) : (preserved?.quotedTweetJson ?? null)
  ]);"""
              s = replace_required(s, old_insert, new_insert, 'bookmarks positional insert')
              p.write_text(s)

              # graphql-bookmarks: robust bookmarkedAt extraction.
              p = Path('src/graphql-bookmarks.ts')
              s = p.read_text()
              old_helper = """function snowflakeToIso(snowflake: string): string | null {
  try {
    const id = BigInt(snowflake);
    const ms = Number(id >> 22n) + Number(TWITTER_SNOWFLAKE_EPOCH);
    const date = new Date(ms);
    return Number.isFinite(date.getTime()) ? date.toISOString() : null;
  } catch {
    return null;
  }
}"""
              new_helper = """function isSaneTimestampMs(ms: number): boolean {
  const min = Date.UTC(2006, 0, 1);
  const max = Date.now() + 365 * 24 * 60 * 60 * 1000;
  return Number.isFinite(ms) && ms >= min && ms <= max;
}

function isoFromMs(ms: number): string | null {
  if (!isSaneTimestampMs(ms)) return null;
  const date = new Date(ms);
  return Number.isFinite(date.getTime()) ? date.toISOString() : null;
}

function snowflakeToIso(snowflake: string): string | null {
  try {
    const id = BigInt(snowflake);
    const ms = Number(id >> 22n) + Number(TWITTER_SNOWFLAKE_EPOCH);
    return isoFromMs(ms);
  } catch {
    return null;
  }
}

function timestampLikeToIso(value: unknown): string | null {
  if (typeof value === 'string') {
    const trimmed = value.trim();
    if (!trimmed) return null;

    if (/^\\d+$/.test(trimmed)) {
      const n = Number(trimmed);
      if (Number.isSafeInteger(n)) {
        if (trimmed.length <= 10) return isoFromMs(n * 1000);
        if (trimmed.length >= 12 && trimmed.length <= 14) return isoFromMs(n);
        if (trimmed.length >= 15 && trimmed.length <= 17) return isoFromMs(Math.floor(n / 1000));
      }
      return snowflakeToIso(trimmed);
    }

    const parsed = Date.parse(trimmed);
    return Number.isFinite(parsed) ? isoFromMs(parsed) : null;
  }

  if (typeof value === 'number' && Number.isFinite(value)) {
    if (value < 10_000_000_000) return isoFromMs(value * 1000);
    if (value < 10_000_000_000_000) return isoFromMs(value);
    if (value < 10_000_000_000_000_000) return isoFromMs(Math.floor(value / 1000));
  }

  return null;
}

function collectBookmarkTimestampCandidates(value: unknown, out: unknown[] = [], depth = 0): unknown[] {
  if (depth > 8 || value == null) return out;
  if (Array.isArray(value)) {
    for (const item of value) collectBookmarkTimestampCandidates(item, out, depth + 1);
    return out;
  }
  if (typeof value !== 'object') return out;

  for (const [key, child] of Object.entries(value as Record<string, unknown>)) {
    if (/^(sortIndex|sort_index|bookmarked_at|bookmarkedAt|bookmark_created_at|bookmarkCreatedAt|saved_at|savedAt)$/i.test(key)) {
      out.push(child);
    }
    if (typeof child === 'object' && child != null) {
      collectBookmarkTimestampCandidates(child, out, depth + 1);
    }
  }
  return out;
}

function extractBookmarkedAtFromEntry(entry: unknown, record: BookmarkRecord): string | null {
  const candidates = collectBookmarkTimestampCandidates(entry);
  for (const candidate of candidates) {
    const iso = timestampLikeToIso(candidate);
    if (!iso) continue;
    const sanitized = sanitizeBookmarkedAt({...record, bookmarkedAt: iso});
    if (sanitized.bookmarkedAt) return sanitized.bookmarkedAt;
  }
  return null;
}"""
              s = replace_required(s, old_helper, new_helper, 'snowflake helper')
              old_assignment = """    if (record) {
      // Extract bookmarkedAt from the entry's sortIndex (snowflake timestamp)
      if (entry.sortIndex) {
        record.bookmarkedAt = snowflakeToIso(entry.sortIndex) ?? record.bookmarkedAt;
      }
      records.push(sanitizeBookmarkedAt(record));
    }"""
              new_assignment = """    if (record) {
      record.bookmarkedAt = extractBookmarkedAtFromEntry(entry, record) ?? record.bookmarkedAt;
      records.push(sanitizeBookmarkedAt(record));
    }"""
              s = replace_required(s, old_assignment, new_assignment, 'bookmarkedAt assignment')
              p.write_text(s)

              # Tests: import listBookmarks and append regression cases.
              p = Path('tests/bookmarks-db.test.ts')
              s = p.read_text()
              s = s.replace("sanitizeFtsQuery } from '../src/bookmarks-db.js';", "sanitizeFtsQuery, listBookmarks } from '../src/bookmarks-db.js';")
              if 'buildIndex tolerates additive bookmark table columns' not in s:
                  s += '''

test('buildIndex tolerates additive bookmark table columns', async () => {
  await withIsolatedDataDir(async (dir) => {
    const jsonl = FIXTURES.map((r) => JSON.stringify(r)).join('\\n') + '\\n';
    await writeFile(path.join(dir, 'bookmarks.jsonl'), jsonl);
    await buildIndex();

    const dbPath = twitterBookmarksIndexPath();
    const db = await openDb(dbPath);
    try {
      db.run('ALTER TABLE bookmarks ADD COLUMN future_column TEXT');
      saveDb(db, dbPath);
    } finally {
      db.close();
    }

    const result = await buildIndex();
    assert.equal(result.recordCount, 3);
    const bookmark = await getBookmarkById('1');
    assert.ok(bookmark);
    assert.equal(bookmark.text, 'Machine learning is transforming healthcare');
  });
});

test('listBookmarks sorts valid ISO-like bookmark dates using SQLite GLOB semantics', async () => {
  await withIsolatedDataDir(async (dir) => {
    const records = [
      {...FIXTURES[0], id: 'old', tweetId: '100', bookmarkedAt: '2026-01-01T00:00:00.000Z'},
      {...FIXTURES[1], id: 'new', tweetId: '101', bookmarkedAt: '2026-02-01T00:00:00.000Z'},
    ];
    await writeFile(path.join(dir, 'bookmarks.jsonl'), records.map((r) => JSON.stringify(r)).join('\\n') + '\\n');

    await buildIndex({force: true});
    const listed = await listBookmarks({sort: 'desc', limit: 2});
    assert.equal(listed[0].id, 'new');
    assert.equal(listed[1].id, 'old');
  });
});
'''
              p.write_text(s)

              p = Path('tests/graphql-bookmarks.test.ts')
              s = p.read_text()
              if 'parseBookmarksResponse: extracts bookmarkedAt from nested bookmark metadata' not in s:
                  insert = '''test('parseBookmarksResponse: extracts bookmarkedAt from nested bookmark metadata', () => {
  const tr = makeTweetResult();
  const resp = {
    data: {
      bookmark_timeline_v2: {
        timeline: {
          instructions: [{
            type: 'TimelineAddEntries',
            entries: [{
              entryId: 'tweet-0',
              content: {
                itemContent: { tweet_results: { result: tr } },
                bookmark_info: { bookmarked_at: '2026-03-12T00:00:00.000Z' },
              },
            }],
          }],
        },
      },
    },
  };
  const { records } = parseBookmarksResponse(resp, NOW);
  assert.equal(records.length, 1);
  assert.equal(records[0].bookmarkedAt, '2026-03-12T00:00:00.000Z');
});

test('parseBookmarksResponse: ignores invalid future bookmarkedAt candidates and keeps valid later candidate', () => {
  const tr = makeTweetResult();
  const resp = {
    data: {
      bookmark_timeline_v2: {
        timeline: {
          instructions: [{
            type: 'TimelineAddEntries',
            entries: [{
              entryId: 'tweet-0',
              sortIndex: '9999999999999999999',
              content: {
                itemContent: { tweet_results: { result: tr } },
                bookmark_info: { bookmarked_at: '2026-03-13T00:00:00.000Z' },
              },
            }],
          }],
        },
      },
    },
  };
  const { records } = parseBookmarksResponse(resp, NOW);
  assert.equal(records.length, 1);
  assert.equal(records[0].bookmarkedAt, '2026-03-13T00:00:00.000Z');
});

'''
                  needle = "test('parseBookmarksResponse: handles missing sortIndex gracefully', () => {"
                  s = replace_required(s, needle, insert + needle, 'graphql missing-sortIndex test')
              p.write_text(s)

              Path('.codemod-error').unlink(missing_ok=True)
          except Exception:
              Path('.codemod-error').write_text(traceback.format_exc())
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply ship-readiness P0 patch"
          git push origin HEAD:work/ship-readiness-p0
