name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.3.4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }} asset
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-13
            platform: macos
            arch: x64
          - runner: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          asset="bookmark-cli-ts-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "pkg/$asset"
          cp -R bin dist node_modules package.json README.md LICENSE "pkg/$asset/"
          cat > "pkg/$asset/bookmark-cli-ts" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec node "$SCRIPT_DIR/bin/ft.mjs" "$@"
          EOF
          chmod +x "pkg/$asset/bookmark-cli-ts"
          tar -C "pkg/$asset" -czf "$asset.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bookmark-cli-ts-${{ matrix.platform }}-${{ matrix.arch }}
          path: bookmark-cli-ts-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build-release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*.tar.gz
